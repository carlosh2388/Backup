<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body.bg-siasa{
      background:
        radial-gradient(1200px 600px at 15% 10%, rgba(37,99,235,0.18), transparent 60%),
        radial-gradient(900px 500px at 85% 20%, rgba(79,70,229,0.18), transparent 55%),
        linear-gradient(135deg, #f8fafc 0%, #e9f0ff 40%, #eef2ff 100%);
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-siasa">

  <!-- Contenedor principal -->
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg overflow-hidden">

    <!-- BANNER -->
    <div class="h-32 bg-gradient-to-r from-blue-600 to-indigo-600 flex items-center justify-center">
      <img 
        src="/image/logoSiasa.jpeg" 
        alt="Logo empresa" 
        class="h-16 object-contain"
      />
    </div>

    <!-- LOGIN -->
    <div class="p-6">
      <h2 class="text-2xl font-semibold text-center text-gray-800 mb-6">
        Iniciar sesión
      </h2>

    <input id="username" class="w-full p-2 border mb-3 rounded" placeholder="Usuario">
  <input id="password" type="password" class="w-full p-2 border mb-4 rounded" placeholder="Contraseña">

  <button onclick="login()"
    class="w-full bg-blue-600 text-white py-2 rounded">
    Entrar
  </button>

  <p id="error" class="text-red-600 text-sm mt-3 hidden"></p>
</div>

<script>
async function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  const res = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password })
  });

  const data = await res.json();

  if (!res.ok) {
    document.getElementById("error").textContent = data.message || "Error";
    document.getElementById("error").classList.remove("hidden");
    return;
  }

  // ✅ guardar token
  localStorage.setItem("token", data.token);

  // ✅ redirigir
  window.location.href = "/dashboard.html";
}
</script>

    </div>

  </div>

</body>
</html>
